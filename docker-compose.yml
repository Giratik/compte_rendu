#docker-compose.yml

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ia-backend
    volumes:
      - /home/paulvidouze/.cache/huggingface:/root/.cache/huggingface
      - /home/paulvidouze/.cache/torch:/root/.cache/torch
    ports:
      - "8001:8001" # Aligné avec uvicorn
    runtime: nvidia    

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/root/.cache/huggingface
      # Permet à la librairie python "ollama" de trouver le Ollama local
      - OLLAMA_HOST=http://10.75.12.5:11434
      - DEBUG_LOG_TOGGLE=OFF

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ia-frontend
    ports:
      - "8502:8501" 
    environment:
      - API_URL=http://backend:8001

      - OLLAMA_DEFAULT_MODEL=gemma4:e4b
      - TAILLE_MORCEAU=2000
      - CHUNK_CONTEXT_SIZE=30000
      - FULL_SUMMARY_CONTEXT_SIZE=30000
      - WHISPER_MODEL=large-v3
      - TEMPERATURE=0.15
      - NB_CHUNKS=3

      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=5000
      - STREAMLIT_BROWSER_SERVER_ADDRESS=10.75.12.5
      - STREAMLIT_BROWSER_SERVER_PORT=8502
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    depends_on:
      - backend