#docker-compose.yml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: CR_backend
    volumes:
      - /home/paulvidouze/.cache/huggingface:/root/.cache/huggingface
      - /home/paulvidouze/.cache/torch:/root/.cache/torch
    ports:
      - "8001:8000" # Aligné avec uvicorn

    environment:
      - HF_HOME=/root/.cache/huggingface
      # Permet à la librairie python "ollama" de trouver le Ollama local
      - OLLAMA_HOST=http://10.75.12.5:11434
      - DEBUG_LOG_TOGGLE=OFF
      - ENABLE_LLM_REASONING=True
      - EMBEDDING_MODEL=embeddinggemma:latest
      # ← ChromaDB joignable via son nom de service sur chroma_net
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000

      - CONTEXT_SIZE=22000
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default
      - chroma_net   # ← rejoint le réseau ChromaDB

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: CR_frontend
    ports:
      - "8502:8501"
    environment:
      - API_URL=http://backend:8000
      - OLLAMA_DEFAULT_MODEL=gemma4:e4b
      - TAILLE_MORCEAU=2000
      - CHUNK_CONTEXT_SIZE=22000
      - FULL_SUMMARY_CONTEXT_SIZE=22000
      - WHISPER_MODEL=large-v3
      - TEMPERATURE=0.15
      - NB_CHUNKS=3

      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=5000
      - STREAMLIT_BROWSER_SERVER_ADDRESS=10.75.12.5
      - STREAMLIT_BROWSER_SERVER_PORT=8502
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false

      - CHUNK_WORDS_DEFAULT=6000
      - CHUNK_WORDS_MIN=1000
      - CHUNK_WORDS_MAX=12000
      - CHUNK_WORDS_STEP=500

      - OVERLAP_WORDS_DEFAULT=150
      - OVERLAP_WORDS_MIN=0
      - OVERLAP_WORDS_MAX=500
      - OVERLAP_WORDS_STEP=50
    depends_on:
      - backend

networks:
  default: {}
  chroma_net:
    external: true   # ← réseau déclaré dans l'autre docker-compose